<h3>Overview</h3>
<h4>&nbsp;</h4>
<ul>
  <li>MEDI3200 Translational Biology and Genomics moving to session 2 offering.<br>&nbsp;</li>
  <li>Some selective units no longer being offered.<br>&nbsp;</li>
  <li>New codes/form for three units in 2026.<br>&nbsp;</li>

<b>If you want advice on your specific study plan, please visit enrolment support at <a href="https://students.mq.edu.au/study/enrolling/how-to-enrol">https://students.mq.edu.au/study/enrolling/how-to-enrol</a>.</b>

<h3>MED3200 Translational Biology and Genomics</h3>
<h4>Moving from session 1 to session 2</h4>

<b>Reason</b>
<br>Previously, in the accelerated 2-year progression form of the degree, session 1 of year 2 had 5×10 credit point core units. Moving MEDI3200 to session 2 balances the workload better between session 1 and 2 of the second year.

<b>Who will this affect?</b>
<table style="width: 100%;">
  <tr>
    <th style="width: 33%;">2024 and previous commencing students who have completed MEDI3200</th>
    <th style="width: 33%;">2024 and previous commencing students who have <b>not</b> completed MEDI3200</th>
    <th style="width: 33%;">2025 commencing students</th>
  </tr>
  <tr>
    <td>No impact.</td>
    <td>Altered study plan.</td>
    <td>Spreads the workload between session 1 and 2 in the second year of the degree. May alter which electives you take in the elective space.</td>
  </tr>
</table>

--
<h3>MED3200 Translational Biology and Genomics</h3>
<h4>Moving from session 1 to session 2</h4>
<b>Action to take</b>
<table style="width: 100%;">
  <tr>
    <th style="width: 33%;">2024 and previous commencing students who have completed MEDI3200</th>
    <th style="width: 33%;">2024 and previous commencing students who have <b>not</b> completed MEDI3200</th>
    <th style="width: 33%;">2025 commencing students</th>
  </tr>
  <tr>
    <td>No action needed.</td>
    <td>Lodge an <a href="https://students.mq.edu.au/study/enrolling/how-to-enrol">Enrolment Support request</a> if MEDI3200 would be the <b>only</b> unit you require to take in Session 2, 2026. An alternative study pathway will be found to give you the opportunity to complete in Session 1, 2026.</td>
    <td>No action needed, other than adjusting your elective choices if needed.</td>
    </td>
  </tr>
</table>

<b>Reason</b>
<br>Units that are no longer core to a degree in this Faculty are being removed due to low enrolments and other suitable study pathways being available.

<b>Who will this affect?</b>
<table style="width: 100%;">
  <tr>
    <th style="width: 50%;">2024 and previous commencing students</th>
    <th style="width: 50%;">2025 commencing students</th>
  </tr>
  <tr>
    <td>Changes in offerings in the 40 credit point "Selective" unit space.</td>
    <td>No impact.</td>
  </tr>
</table>

<b>Action to take</b>

<table style="width: 100%;">
  <tr>
    <th style="width: 50%;">2024 and previous commencing students</th>
    <th style="width: 50%;">2025 commencing students</th>
  </tr>
  <tr>
    <td>Choose alternative Selective units from the approved list. See next slide for choices.</td>
    <td>No action needed.</td>
  </tr>
</table>

<h3>New unit codes/forms for three units in 2026</h3>

<b>Reason</b><br>Rather than duplicating similar units in different degrees, common units are being combined into one unit and taught into multiple degrees. This will strengthen teaching teams and also allow working with more diverse student cohorts in your classes.

<b>Who will this affect?</b><br>Anyone who has not completed either ANAT1001 Introduction to Anatomy, MEDI2100 Musculoskeletal System or MEDI2101 Cardiovascular and Respiratory System by the end of 2025.

<b>Action to take:</b><br>You will be able to enrol in the equivalent new unit code/form in 2026.


<table style="width: 100%;">
  <tr>
    <th style="width: 50%;">Current unit code/form</th>
    <th style="width: 50%;">New unit code/form from 2026</th>
  </tr>
  <tr>
    <td>ANAT1001 Introduction to Anatomy</td>
    <td>MHHS1002 Human Structure and Function</td>
  </tr>
  <tr>
    <td>MEDI2100 Musculoskeletal System</td>
    <td>MHHS2401 Musculoskeletal System</td>
  </tr>
  <tr>
    <td>MEDI2101 Cardiovascular and Respiratory System</td>
    <td>MHHS2402 Cardiovascular, Renal and Respiratory System</td>
  </tr>
</table>

  </tr>
</table>
